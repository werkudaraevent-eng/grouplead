<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alur Kerja Sales Activity</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FB; --paper-2:#FFFFFF; --paper-3:rgba(41,45,48,0.03);
  --ink:#292D30; --muted:#5F6B76; --soft:#8A94A0;
  --rule:rgba(41,45,48,0.12); --rule-strong:rgba(41,45,48,0.26); --dots:rgba(41,45,48,0.10);
  --accent:#02378D; --accent-tint:rgba(2,55,141,0.08);
  --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-serif:'Instrument Serif',Georgia,serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181D; --paper-2:#1C2128; --paper-3:rgba(233,237,242,0.04);
    --ink:#E9EDF2; --muted:#A9B3BF; --soft:#7C8792;
    --rule:rgba(233,237,242,0.14); --rule-strong:rgba(233,237,242,0.30); --dots:rgba(233,237,242,0.10);
    --accent:#8FB4F5; --accent-tint:rgba(143,180,245,0.14);
  }
}
:root[data-theme="dark"]{
  --paper:#14181D; --paper-2:#1C2128; --paper-3:rgba(233,237,242,0.04);
  --ink:#E9EDF2; --muted:#A9B3BF; --soft:#7C8792;
  --rule:rgba(233,237,242,0.14); --rule-strong:rgba(233,237,242,0.30); --dots:rgba(233,237,242,0.10);
  --accent:#8FB4F5; --accent-tint:rgba(143,180,245,0.14);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding-block:40px;padding-inline:20px}
.frame{max-width:1120px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-family:var(--font-serif);font-weight:400;font-size:clamp(1.6rem,2.4vw + .8rem,2.1rem);letter-spacing:-.02em;line-height:1.15;margin:0 0 8px;text-wrap:balance}
.lede{max-width:64ch;font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
figure{margin:0}
svg{display:block;width:100%;min-width:880px;height:auto}
figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:16px;max-width:72ch}
.paper{fill:var(--paper)} .dot{fill:var(--dots)}
.lane{stroke:var(--rule);stroke-width:1} .lane-strong{stroke:var(--rule-strong);stroke-width:1}
.node{fill:var(--paper-2);stroke:var(--ink);stroke-width:1}
.oval{fill:var(--paper-3);stroke:var(--rule-strong);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1}
.name{fill:var(--ink);font-family:var(--font-sans);font-size:12px;font-weight:600}
.sub{fill:var(--muted);font-family:var(--font-mono);font-size:9px}
.eb{fill:var(--muted);font-family:var(--font-mono);font-size:9px;letter-spacing:.18em}
.lbl{fill:var(--muted);font-family:var(--font-mono);font-size:8px;letter-spacing:.12em}
.lbl-accent{fill:var(--accent);font-family:var(--font-mono);font-size:8px;letter-spacing:.12em}
.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2}
.edge-dash{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.edge-accent{fill:none;stroke:var(--accent);stroke-width:1.4}
.mk{fill:var(--muted)} .mk-accent{fill:var(--accent)}
.legend{fill:var(--muted);font-family:var(--font-sans);font-size:9px}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Swimlane · Sales Activity</p>
  <h1>Alur kerja Sales Activity</h1>
  <p class="lede">Satu kunjungan dari prospek sampai lead di LeadEngine, dibaca per pelaku: siapa yang mencatat, siapa yang berkunjung, siapa yang menulis, dan apa yang dikerjakan sistem sendiri.</p>

  <marker id="alur-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="mk-accent"/></marker>
</defs>

<rect x="444" y="154" width="64" height="12" rx="2" class="mask"/><text x="448" y="163" class="lbl" text-anchor="start">PENUGASAN</text>
<rect x="312" y="154" width="84" height="12" rx="2" class="mask"/><text x="392" y="163" class="lbl" text-anchor="end">JADWAL ULANG</text>

<rect x="352" y="88" width="136" height="48" rx="6" class="node"/><text x="420.0" y="110" class="name" text-anchor="middle">Buat aktivitas</text><text x="420.0" y="124" class="sub" text-anchor="middle">jadwal · tim · kontak</text>

<line x1="40" y1="472" x2="960" y2="472" class="lane"/>

</svg></div>
    <figcaption>Kirim laporan adalah titik fokus: dari sanalah kunjungan tercatat di CRM secara otomatis, tindak lanjut lahir, dan lead dikirim bila ada peluang. Brief AI harian, papan TV, dan kalender publik membaca hasil yang sama dan sengaja tidak digambar di sini.</figcaption>
  </figure>
</div>
</body>
</html>
