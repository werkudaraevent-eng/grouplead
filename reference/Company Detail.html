<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkudara Nirwana Sakti — Company Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F4F6;--sidebar:#0E1117;--white:#FFFFFF;
  --border:#E5E7EB;--border-light:#F3F4F6;
  --t1:#111827;--t2:#6B7280;--t3:#9CA3AF;
  --accent:#4F51E8;--accent-bg:#EEF2FF;--accent-mid:#C7D2FE;
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FEF2F2;
  --orange:#EA580C;--orange-bg:#FFF7ED;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --teal:#0D9488;--teal-bg:#F0FDFA;
  --r-card:12px;--r-btn:8px;--r-sm:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
  --shadow-bar:0 -4px 24px rgba(15,23,42,.07),0 -1px 4px rgba(15,23,42,.04);
}
html,body,#root{height:100%;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--t1)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}

/* ── Sidebar ── */
.sidebar{width:220px;min-width:220px;background:var(--sidebar);display:flex;flex-direction:column;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 14px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.sb-name{color:#F9FAFB;font-weight:700;font-size:13.5px;line-height:1.2}
.sb-sub{color:#4B5563;font-size:11px;margin-top:1px}
.sb-holding{margin:14px 12px 4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:8px;color:#D1D5DB;font-size:12.5px;font-weight:600;cursor:pointer}
.sb-holding:hover{background:rgba(255,255,255,.07)}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.sb-group-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:#374151;text-transform:uppercase;padding:14px 8px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#9CA3AF;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#D1D5DB}
.nav-item.active{background:rgba(99,102,241,.18);color:#A5B4FC}
.nav-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-bottom{padding:12px 10px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px;color:#9CA3AF;font-size:12px;cursor:pointer}
.sb-bottom:hover{color:#D1D5DB}

/* ── Topbar ── */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow-sm)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2)}
.crumb-link{color:var(--t2);cursor:pointer;font-weight:500;transition:color .15s}
.crumb-link:hover{color:var(--accent)}
.crumb-sep{color:var(--t3)}
.crumb-current{color:var(--t1);font-weight:600}
.tb-right{display:flex;align-items:center;gap:8px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-btn);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border:1.5px solid var(--accent)}
.btn-primary:hover{background:#3F41D8;border-color:#3F41D8}
.btn-primary:disabled{background:#A5B4FC;border-color:#A5B4FC;cursor:not-allowed}
.btn-outline{background:#fff;color:var(--t1);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--bg);border-color:#D1D5DB}
.btn-ghost{background:transparent;color:var(--t2);border:1.5px solid transparent}
.btn-ghost:hover{background:var(--bg);color:var(--t1)}
.btn-danger{background:#fff;color:var(--red);border:1.5px solid #FECACA}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 10px;font-size:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;color:var(--t2)}
.icon-btn:hover{background:var(--bg);color:var(--t1)}

/* ── Page ── */
.page-scroll{flex:1;overflow-y:auto;padding-bottom:90px}
.page-inner{max-width:1080px;margin:0 auto;padding:24px 32px 16px}

/* ── Hero ── */
.hero{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:18px}
.hero-banner{height:96px;background:
  linear-gradient(120deg,#4F51E8 0%,#7C3AED 50%,#A855F7 100%);
  position:relative}
.hero-banner::after{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 20% 50%,rgba(255,255,255,.18) 0%,transparent 40%),
  radial-gradient(circle at 80% 50%,rgba(255,255,255,.10) 0%,transparent 40%)}
.hero-body{padding:0 24px 18px;display:flex;align-items:flex-end;gap:18px;margin-top:-30px;position:relative;z-index:2}
.hero-logo{width:80px;height:80px;border-radius:18px;background:#fff;border:4px solid #fff;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.hero-meta{flex:1;min-width:0;padding-bottom:6px}
.hero-title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hero-title{font-size:24px;font-weight:800;color:var(--t1);letter-spacing:-.4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-gray{background:#F3F4F6;color:var(--t2)}
.hero-sub{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--t2);flex-wrap:wrap}
.hero-sub-item{display:inline-flex;align-items:center;gap:5px}
.hero-sub-item code{font-family:'JetBrains Mono','SFMono-Regular',Menlo,monospace;background:var(--bg);padding:1px 6px;border-radius:4px;color:var(--t1);font-size:11.5px;font-weight:600}
.hero-actions{display:flex;align-items:center;gap:8px;padding-bottom:6px}

/* ── Stat strip ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.stat-card.green::before{background:var(--green)}
.stat-card.amber::before{background:var(--amber)}
.stat-card.purple::before{background:var(--purple)}
.stat-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat-val{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;line-height:1.1;margin-bottom:3px}
.stat-trend{font-size:11px;color:var(--t2);display:inline-flex;align-items:center;gap:4px}
.stat-up{color:var(--green);font-weight:700}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .15s;margin-bottom:-1px}
.tab:hover{color:var(--t1)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-count{background:var(--bg);color:var(--t2);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.tab.active .tab-count{background:var(--accent-bg);color:var(--accent)}

/* ── Section card ── */
.sec-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
.sec-hd{padding:16px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border-light)}
.sec-hd-left{flex:1;min-width:0}
.sec-title{font-size:14px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.sec-sub{font-size:12px;color:var(--t2);margin-top:2px}
.sec-bd{padding:6px 20px}

/* ── Field rows ── */
.field-row{display:grid;grid-template-columns:240px 1fr;gap:32px;padding:16px 0;border-bottom:1px solid var(--border-light);align-items:center}
.field-row:last-child{border-bottom:none}
.field-lbl{font-size:13px;font-weight:600;color:var(--t1)}
.field-hint{font-size:11.5px;color:var(--t2);margin-top:2px;font-weight:400}
.field-required{color:var(--red);margin-left:2px}
.field-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Inputs */
.input,.select,.textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-btn);padding:9px 12px;font-size:13px;color:var(--t1);outline:none;transition:all .15s;font-family:inherit}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,81,232,.12)}
.input:hover:not(:focus),.select:hover:not(:focus){border-color:#D1D5DB}
.input-group{display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:var(--r-btn);background:#fff;overflow:hidden;transition:all .15s}
.input-group:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,81,232,.12)}
.input-group .pfx{display:flex;align-items:center;padding:0 12px;background:var(--bg);border-right:1.5px solid var(--border);font-size:12px;color:var(--t2);font-family:'JetBrains Mono',monospace;font-weight:600}
.input-group input{flex:1;border:none;outline:none;padding:9px 12px;font-size:13px;background:transparent}
.textarea{resize:vertical;min-height:72px;line-height:1.5}
.copy-btn{padding:9px 11px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-btn);color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;transition:all .15s}
.copy-btn:hover{background:#fff;color:var(--accent);border-color:var(--accent-mid)}

/* Toggle */
.toggle{position:relative;width:38px;height:22px;background:#E5E7EB;border-radius:20px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(16px)}

/* Members table */
.member-tbl{width:100%;border-collapse:collapse}
.member-tbl thead{background:var(--bg)}
.member-tbl th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.member-tbl td{padding:14px 16px;font-size:13px;color:var(--t1);border-bottom:1px solid var(--border-light);vertical-align:middle}
.member-tbl tr:last-child td{border-bottom:none}
.member-tbl tr:hover td{background:#FAFBFC}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.avatar.sm{width:26px;height:26px;font-size:10.5px}
.avatar-stack{display:flex}
.avatar-stack .avatar{border:2px solid #fff;margin-right:-8px}
.member-cell{display:flex;align-items:center;gap:10px}
.member-name{font-weight:600;color:var(--t1);font-size:13px;line-height:1.2}
.member-email{font-size:11.5px;color:var(--t2);margin-top:1px}
.role-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-bg);color:var(--accent)}
.role-pill.lead{background:var(--purple-bg);color:var(--purple)}
.role-pill.member{background:#F3F4F6;color:var(--t2)}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t1)}
.status-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.status-dot.away::before{background:var(--amber)}
.status-dot.offline::before{background:#D1D5DB}

/* Activity */
.activity-list{padding:6px 0}
.act-item{display:flex;gap:12px;padding:12px 20px;position:relative}
.act-item:not(:last-child)::before{content:'';position:absolute;left:32px;top:36px;bottom:-12px;width:2px;background:var(--border-light)}
.act-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-bg);color:var(--accent);position:relative;z-index:1}
.act-icon.green{background:var(--green-bg);color:var(--green)}
.act-icon.amber{background:var(--amber-bg);color:var(--amber)}
.act-icon.purple{background:var(--purple-bg);color:var(--purple)}
.act-body{flex:1;padding-top:6px}
.act-text{font-size:13px;color:var(--t1);line-height:1.5}
.act-text strong{font-weight:700}
.act-time{font-size:11.5px;color:var(--t3);margin-top:2px}

/* Danger zone */
.danger-card{border:1.5px solid #FECACA;background:#FFFBFB}
.danger-card .sec-hd{border-bottom-color:#FECACA}
.danger-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #FECACA}
.danger-row:last-child{border-bottom:none}
.danger-info{flex:1}
.danger-title{font-size:13px;font-weight:700;color:var(--t1)}
.danger-sub{font-size:12px;color:var(--t2);margin-top:2px;line-height:1.5;max-width:520px}

/* Save bar */
.save-bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);box-shadow:var(--shadow-bar);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:10;transform:translateY(100%);transition:transform .25s ease-out;opacity:0}
.save-bar.show{transform:translateY(0);opacity:1}
.save-status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t1);font-weight:500}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(217,119,6,.15);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.save-actions{display:flex;align-items:center;gap:10px}
.save-shortcut{font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.save-shortcut kbd{background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:600;color:var(--t2)}

/* Toast */
.toast{position:fixed;top:72px;right:24px;background:#0E1117;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);z-index:1000;transform:translateX(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:translateX(0)}
.toast .check{width:18px;height:18px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff}

/* ── Misc ── */
.muted{color:var(--t2)}
.spacer{flex:1}
.tag-input{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--r-btn);background:#fff;min-height:40px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--accent-bg);color:var(--accent);border-radius:6px;font-size:12px;font-weight:600}
.tag-x{cursor:pointer;opacity:.6}
.tag-x:hover{opacity:1}
.tag-input input{border:none;outline:none;flex:1;min-width:80px;font-size:13px;padding:4px}

/* Right-side floating help */
.help-card{background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border:1px solid var(--accent-mid);border-radius:var(--r-card);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.help-icon{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;box-shadow:var(--shadow-sm)}
.help-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:2px}
.help-text{font-size:12px;color:var(--t2);line-height:1.5}
.help-link{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
</style>
</head>

<div id="root"></div>

              <div className="danger-sub">Permanently remove this company and <strong>all associated leads, contacts, and history</strong>. This action is irreversible.</div>
            </div>
            <button className="btn btn-danger btn-sm"><Ic n="trash" s={13}/> Delete Company</button>
          </div>
        </div>
      </div>
    </>
  );
}

/* ─────── MAIN ─────── */
function App(){
  const [tab,setTab] = useState('overview');
  const initial = {
    name:'Werkudara Nirwana Sakti',
    legal:'PT Werkudara Nirwana Sakti',
    slug:'wns',
    npwp:'01.234.567.8-901.000',
    email:'contact@wns.werkudara.id',
    phone:'+62 21 5555 8800',
    web:'wns.werkudara.id',
    address:'Menara Werkudara, Lt. 18\nJl. Jend. Sudirman Kav. 52-53\nJakarta Selatan 12190, Indonesia',
    parent:'Werkudara Holding',
    type:'Subsidiary',
    currency:'IDR — Indonesian Rupiah',
    holdingVisible:true,
    extShare:false,
  };
  const [form,setForm] = useState(initial);
  const [savedForm,setSavedForm] = useState(initial);
  const [toast,setToast] = useState(false);

  const dirty = useMemo(()=>JSON.stringify(form)!==JSON.stringify(savedForm),[form,savedForm]);

  const save = () => {
    setSavedForm(form);
    setToast(true);
    setTimeout(()=>setToast(false),2400);
  };
  const discard = () => setForm(savedForm);

  // Cmd/Ctrl+S to save
  useEffect(()=>{
    const onKey = e => {
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s'){
        e.preventDefault();
        if(dirty) save();
      }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[dirty,form]);

  const tabs = [
    {id:'overview',lbl:'Overview',ic:'building'},
    {id:'members',lbl:'Members',ic:'users',count:MEMBERS.length},
    {id:'billing',lbl:'Billing',ic:'receipt'},
    {id:'activity',lbl:'Activity',ic:'clock',count:ACTIVITY.length},
  ];

  return (
    <div className="app">
      <Sidebar/>
      <main className="main">
        <header className="topbar">
          <div className="crumbs">
            <span className="crumb-link">Settings</span>
            <Ic n="chev" s={12} c="#9CA3AF"/>
            <span className="crumb-link">Companies</span>
            <Ic n="chev" s={12} c="#9CA3AF"/>
            <span className="crumb-current">Werkudara Nirwana Sakti</span>
          </div>
          <div className="tb-right">
            <button className="icon-btn"><Ic n="bell" s={15}/></button>
            <button className="icon-btn"><Ic n="search" s={15}/></button>
          </div>
        </header>

        <div className="page-scroll">
          <div className="page-inner">
            <Hero form={form}/>
            <StatStrip/>

            <div className="tabs">
              {tabs.map(t=>(
                <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
                  <Ic n={t.ic} s={14}/>
                  {t.lbl}
                  {t.count!==undefined && <span className="tab-count">{t.count}</span>}
                </div>
              ))}
            </div>

            {tab==='overview' && <OverviewTab form={form} setForm={setForm}/>}
            {tab==='members' && <MembersTab/>}
            {tab==='billing' && <BillingTab/>}
            {tab==='activity' && <ActivityTab/>}
          </div>
        </div>

        <div className={`save-bar ${dirty?'show':''}`}>
          <div className="save-status">
            <span className="save-dot"/>
            <span>You have unsaved changes</span>
            <span className="save-shortcut" style={{marginLeft:8}}>Press <kbd>⌘</kbd> + <kbd>S</kbd> to save</span>
          </div>
          <div className="save-actions">
            <button className="btn btn-ghost" onClick={discard}>Discard</button>
            <button className="btn btn-primary" onClick={save} disabled={!dirty}>
              <Ic n="check" s={14}/> Save Changes
            </button>
          </div>
        </div>

        <div className={`toast ${toast?'show':''}`}>
          <span className="check"><Ic n="check" s={11}/></span>
          Company settings saved
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
